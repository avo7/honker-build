build:
  stage: build
  image: rust:latest
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends mingw-w64
    - rustup target add x86_64-unknown-linux-gnu x86_64-pc-windows-gnu
  variables:
    BUILD_TARGETS: "x86_64-unknown-linux-gnu:libhonker_ext.so x86_64-pc-windows-gnu:honker_ext.dll"
  script:
    - bash build
  artifacts:
    paths:
      - target/x86_64-unknown-linux-gnu/libhonker_ext.so
      - target/x86_64-pc-windows-gnu/honker_ext.dll
