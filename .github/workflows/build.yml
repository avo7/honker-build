name: build

on:
  push:
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    env:
      BUILD_TARGETS: "x86_64-unknown-linux-gnu:libhonker_ext.so x86_64-pc-windows-gnu:honker_ext.dll"
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64
      - run: rustup target add x86_64-unknown-linux-gnu x86_64-pc-windows-gnu
      - run: bash build
      - uses: actions/upload-artifact@v4
        with:
          name: libhonker_ext-linux-x86_64.so
          path: target/x86_64-unknown-linux-gnu/libhonker_ext.so
      - uses: actions/upload-artifact@v4
        with:
          name: honker_ext-windows-x86_64.dll
          path: target/x86_64-pc-windows-gnu/honker_ext.dll

  build-macos:
    runs-on: macos-latest
    env:
      BUILD_TARGETS: "aarch64-apple-darwin:libhonker_ext.dylib x86_64-apple-darwin:libhonker_ext.dylib"
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: bash build
      - uses: actions/upload-artifact@v4
        with:
          name: libhonker_ext-macos-arm64.dylib
          path: target/aarch64-apple-darwin/libhonker_ext.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: libhonker_ext-macos-x86_64.dylib
          path: target/x86_64-apple-darwin/libhonker_ext.dylib
