name: build

on:
  push:
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    env:
      BUILD_TARGETS: "x86_64-unknown-linux-gnu:libhonker_ext.so x86_64-pc-windows-gnu:honker_ext.dll"
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64
      - run: rustup target add x86_64-unknown-linux-gnu x86_64-pc-windows-gnu
      - run: bash build
      - uses: actions/upload-artifact@v4
        with:
          name: libhonker_ext-linux-x86_64.so
          path: target/x86_64-unknown-linux-gnu/libhonker_ext.so
      - uses: actions/upload-artifact@v4
        with:
          name: honker_ext-windows-x86_64.dll
          path: target/x86_64-pc-windows-gnu/honker_ext.dll

  build-macos:
    runs-on: macos-latest
    env:
      BUILD_TARGETS: "aarch64-apple-darwin:libhonker_ext.dylib x86_64-apple-darwin:libhonker_ext.dylib"
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: bash build
      - uses: actions/upload-artifact@v4
        with:
          name: libhonker_ext-macos-arm64.dylib
          path: target/aarch64-apple-darwin/libhonker_ext.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: libhonker_ext-macos-x86_64.dylib
          path: target/x86_64-apple-darwin/libhonker_ext.dylib

  release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir release
          cp artifacts/libhonker_ext-linux-x86_64.so/libhonker_ext.so release/libhonker_ext-linux-x86_64.so
          cp artifacts/honker_ext-windows-x86_64.dll/honker_ext.dll release/honker_ext-windows-x86_64.dll
          cp artifacts/libhonker_ext-macos-arm64.dylib/libhonker_ext.dylib release/libhonker_ext-macos-arm64.dylib
          cp artifacts/libhonker_ext-macos-x86_64.dylib/libhonker_ext.dylib release/libhonker_ext-macos-x86_64.dylib
      - name: Remove previous latest release
        run: gh release delete latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          make_latest: true
          files: release/*
